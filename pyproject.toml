[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyproto-actions"
version = "0.2.0a2"
description = "Experimental independent async MTProto 2.0 client with simple Telegram user actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pycryptodome==4.1.0"]

[project.optional-dependencies]
fast = ["cryptg==0.6.0; python_version >= '3.11'"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easyproto = ["py.typed", "schemas/*.tl", "schemas/*.json", "schemas/UPSTREAM_*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
